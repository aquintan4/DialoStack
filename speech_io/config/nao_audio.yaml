# nao_audio.yaml
#
# Routes speech through the robot's MICROPHONE and SPEAKER (NAO or any other)
# instead of the laptop's, using the DialoStack audio CONTRACT (AudioChunk
# message). STT (Whisper) and TTS (Piper) keep running on the LAPTOP; the robot
# only runs the lightweight audio_bridge_node from this same package.
#
# No dependency on audio_common or any external overlay: audio travels as
# ros2_dialog_interfaces/AudioChunk on /audio_in (mic -> STT) and /audio_out
# (TTS -> speaker).
#
# Usage: pass it AFTER params.yaml to the speech nodes so these values take
# precedence. Example in a launch file:
#     parameters=[params, nao_audio]
#
# On the robot, start the bridge (with its audio_bridge.yaml, adjusting the
# ALSA devices and the SAME capture_sample_rate=16000):
#     ros2 launch speech_io audio_bridge.launch.py
#
# Alternative setups:
#   - Fully local: do not use this file (audio_source=microphone, audio_sink=speaker).
#   - The robot's own driver: have it publish/consume AudioChunk on /audio_in and
#     /audio_out directly; the bridge is not needed then.

speech_to_text_node:
  ros__parameters:
    audio_source: topic
    audio_topic: /audio_in
    sample_rate: 16000          # MUST match the bridge capture_sample_rate

text_to_speech_node:
  ros__parameters:
    audio_sink: topic
    audio_topic: /audio_out
    # sample_rate stays at 22050 (what Piper produces); the bridge opens its
    # output at that rate automatically (it reads it from each AudioChunk).
