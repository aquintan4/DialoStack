  RElbowRoll: 0.75
  RElbowYaw: 0.65
  RHand: 0.6
  RShoulderPitch: 0.35
  RShoulderRoll: -0.2
  RWristYaw: 0.1

# Both arms slightly lower with elbows out — open-palms emphasis.
