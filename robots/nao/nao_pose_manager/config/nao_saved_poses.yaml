  LElbowRoll: -0.95
  LElbowYaw: -0.9
  LHand: 0.55
  LShoulderPitch: 0.45
  LShoulderRoll: 0.2
  LWristYaw: -0.1
  RElbowRoll: 0.95
  RElbowYaw: 0.9
  RHand: 0.55
  RShoulderPitch: 0.45
  RShoulderRoll: -0.2
  RWristYaw: 0.1

# Arms forward and slightly open — gentle "here you go" gesture.
