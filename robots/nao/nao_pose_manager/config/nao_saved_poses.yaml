# ---------------------------------------------------------------------------
# Speech gestures
#
# Design rule: all ShoulderPitch values stay in the 0.7–1.1 range so arms
# never rise above the natural conversational position. Gestures are small
# variations around the active_listening baseline, not dramatic departures.
# ---------------------------------------------------------------------------

# Neutral entry pose — arms rise slightly from rest to signal engagement.
speech_transition:
  LElbowRoll: -0.5
  LElbowYaw: -0.6
  LHand: 0.4
  LShoulderPitch: 1.0
  LShoulderRoll: 0.1
  LWristYaw: 0.0
  RElbowRoll: 0.5
  RElbowYaw: 0.6
  RHand: 0.4
  RShoulderPitch: 1.0
  RShoulderRoll: -0.1
  RWristYaw: 0.0

# Both arms open slightly forward — calm explanatory gesture.
open_explanation:
  LElbowRoll: -0.75
  LElbowYaw: -0.75
  LHand: 0.65
  LShoulderPitch: 0.45
  LShoulderRoll: 0.25
  LWristYaw: 0.0
  RElbowRoll: 0.75
  RElbowYaw: 0.75
  RHand: 0.65
  RShoulderPitch: 0.45
  RShoulderRoll: -0.25
  RWristYaw: 0.0

# Arms spread a bit wider — "as I was saying" breadth gesture.
wide_explanation:
  LElbowRoll: -0.6
  LElbowYaw: -0.95
  LHand: 0.65
  LShoulderPitch: 0.5
  LShoulderRoll: 0.5
  LWristYaw: -0.1
  RElbowRoll: 0.6
  RElbowYaw: 0.95
  RHand: 0.65
  RShoulderPitch: 0.5
  RShoulderRoll: -0.5
  RWristYaw: 0.1

# Right arm leads a small forward gesture; left stays at mid-height.
