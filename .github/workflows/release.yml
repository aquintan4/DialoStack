# Release: on a version tag (v1.2.0), build the Docker image, push it to
# ghcr.io/<owner>/dialostack and publish a GitHub Release that points to it.
#
#   git tag v1.1.0 && git push origin v1.1.0
#
# Manual runs (Actions tab) only build and push the image, tagged with the branch.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dialostack

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # torch, the baked models and the ROS base need more room than the
      # runner has free by default.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<EOF
          ## Docker image

          \`\`\`bash
          docker pull ${IMAGE}:${TAG#v}
          \`\`\`

          Or download the compose file for your system below and run it, then
          open http://localhost:5173:

          - Linux: \`docker compose up\` with \`docker-compose.yml\`
          - Windows 11 (Docker Desktop): \`docker compose -f docker-compose.windows.yml up\`

          See the README section "Run with Docker" for audio and LLM setup.
          EOF
          gh release create "$TAG" docker-compose.yml docker-compose.windows.yml \
            --title "DialoStack $TAG" \
            --notes-file notes.md \
            --generate-notes
